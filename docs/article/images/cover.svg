<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0f1a"/>
      <stop offset="100%" style="stop-color:#0f1629"/>
    </linearGradient>
    <!-- Purple accent glow -->
    <radialGradient id="glow1" cx="30%" cy="40%" r="45%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="65%" r="40%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </radialGradient>
    <!-- Text gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="60%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <!-- AWS orange gradient -->
    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- Glow blobs -->
  <rect width="1200" height="675" fill="url(#glow1)" filter="url(#blur1)"/>
  <rect width="1200" height="675" fill="url(#glow2)" filter="url(#blur1)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#a78bfa" stroke-width="1">
    <line x1="0" y1="112" x2="1200" y2="112"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="337" x2="1200" y2="337"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="562" x2="1200" y2="562"/>
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
  </g>

  <!-- Top-left: AWS badge -->
  <rect x="52" y="44" width="180" height="38" rx="19" fill="#f97316" opacity="0.15"/>
  <rect x="52" y="44" width="180" height="38" rx="19" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.6"/>
  <text x="142" y="68" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fb923c" text-anchor="middle" letter-spacing="1.5">BUILT ON AWS</text>

  <!-- Top-right: Strands SDK badge -->
  <rect x="968" y="44" width="180" height="38" rx="19" fill="#6366f1" opacity="0.15"/>
  <rect x="968" y="44" width="180" height="38" rx="19" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.6"/>
  <text x="1058" y="68" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="1">STRANDS AGENTS SDK</text>

  <!-- Central icon — lift/arrow mark -->
  <g transform="translate(600, 178)" filter="url(#softglow)">
    <circle cx="0" cy="0" r="64" fill="#6366f1" opacity="0.12"/>
    <circle cx="0" cy="0" r="64" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
    <!-- Upward arrow / lift symbol -->
    <polygon points="0,-28 20,6 8,6 8,28 -8,28 -8,6 -20,6" fill="url(#titleGrad)" opacity="0.95"/>
  </g>

  <!-- Main title -->
  <text x="600" y="320" font-family="Arial Black, Arial, sans-serif" font-size="68" font-weight="900" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="-1">CareerLift AI</text>

  <!-- Subtitle -->
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.5">Language-Fair Interview Coach</text>

  <!-- Thin divider -->
  <line x1="380" y1="408" x2="820" y2="408" stroke="#6366f1" stroke-width="1" opacity="0.5"/>

  <!-- Tagline -->
  <text x="600" y="446" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="middle">Plain English. Tamil. Any register. Same fair technical score.</text>

  <!-- Five phase pills at bottom -->
  <g transform="translate(600, 540)">
    <!-- Phase 0 -->
    <rect x="-500" y="-22" width="178" height="44" rx="22" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9"/>
    <text x="-411" y="-4" font-family="Arial, sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="700">PHASE 0</text>
    <text x="-411" y="12" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">Learning Intel</text>
    <!-- Phase 1 -->
    <rect x="-300" y="-22" width="178" height="44" rx="22" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9"/>
    <text x="-211" y="-4" font-family="Arial, sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="700">PHASE 1</text>
    <text x="-211" y="12" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">Interview Studio</text>
    <!-- Phase 2 -->
    <rect x="-89" y="-22" width="178" height="44" rx="22" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9"/>
    <text x="0" y="-4" font-family="Arial, sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="700">PHASE 2</text>
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">Coding Arena</text>
    <!-- Phase 3 -->
    <rect x="111" y="-22" width="178" height="44" rx="22" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9"/>
    <text x="200" y="-4" font-family="Arial, sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="700">PHASE 3</text>
    <text x="200" y="12" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">Assessment</text>
    <!-- Phase 4 -->
    <rect x="311" y="-22" width="178" height="44" rx="22" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9"/>
    <text x="400" y="-4" font-family="Arial, sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="700">PHASE 4</text>
    <text x="400" y="12" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">System Design</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="635" width="1200" height="40" fill="#6366f1" opacity="0.08"/>
  <text x="600" y="660" font-family="Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Strands SDK: Workshop to Ship  ·  AWS Builder Center Hackathon 2026  ·  Education Track</text>

  <!-- Decorative corner dots -->
  <circle cx="48" cy="627" r="3" fill="#6366f1" opacity="0.4"/>
  <circle cx="62" cy="627" r="3" fill="#6366f1" opacity="0.25"/>
  <circle cx="76" cy="627" r="3" fill="#6366f1" opacity="0.15"/>
  <circle cx="1152" cy="627" r="3" fill="#6366f1" opacity="0.4"/>
  <circle cx="1138" cy="627" r="3" fill="#6366f1" opacity="0.25"/>
  <circle cx="1124" cy="627" r="3" fill="#6366f1" opacity="0.15"/>
</svg>
