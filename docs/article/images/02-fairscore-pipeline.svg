<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Inter,Segoe UI,system-ui,sans-serif">
  <rect width="860" height="440" fill="#07060d" rx="12"/>
  <pattern id="d2" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="11" cy="11" r="1" fill="rgba(255,255,255,0.04)"/>
  </pattern>
  <rect width="860" height="440" fill="url(#d2)" rx="12"/>

  <text x="430" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="white">FairScore — Dual-Axis Scoring Pipeline</text>
  <text x="430" y="52" text-anchor="middle" font-size="11" fill="#64748b">Code owns every verdict · Model supplies evidence only · Abstain over guess</text>

  <!-- Step 1: Input -->
  <rect x="30" y="80" width="140" height="75" rx="10" fill="#151327" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <text x="100" y="102" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8">Student Answer</text>
  <text x="100" y="118" text-anchor="middle" font-size="10" fill="#64748b">text (up to 8 000 chars)</text>
  <text x="100" y="133" text-anchor="middle" font-size="10" fill="#64748b">expected concepts</text>
  <text x="100" y="148" text-anchor="middle" font-size="10" fill="#64748b">from server</text>

  <!-- Step 2: Input gate -->
  <rect x="220" y="80" width="140" height="75" rx="10" fill="#151327" stroke="#f87171" stroke-width="2"/>
  <text x="290" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#f87171">PII Gate</text>
  <text x="290" y="116" text-anchor="middle" font-size="10" fill="#94a3b8">BeforeModelCallEvent</text>
  <text x="290" y="131" text-anchor="middle" font-size="10" fill="#94a3b8">Blocks phone / email</text>
  <text x="290" y="146" text-anchor="middle" font-size="10" fill="#94a3b8">0 tokens if rejected</text>
  <line x1="170" y1="117" x2="220" y2="117" stroke="#f87171" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- Gate output: rejected -->
  <text x="290" y="170" text-anchor="middle" font-size="9.5" fill="#f87171">rejected → fixed ABSTAIN text</text>
  <line x1="290" y1="155" x2="290" y2="165" stroke="#f87171" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Strands Graph box -->
  <rect x="20" y="210" width="600" height="175" rx="12" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="320" y="227" text-anchor="middle" font-size="11" fill="#a78bfa">Strands GraphBuilder</text>

  <!-- Evaluate node -->
  <rect x="50" y="240" width="140" height="60" rx="8" fill="#1c1930" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="120" y="260" text-anchor="middle" font-size="11" font-weight="600" fill="white">Technical Evaluator</text>
  <text x="120" y="275" text-anchor="middle" font-size="10" fill="#94a3b8">BedrockModel</text>
  <text x="120" y="290" text-anchor="middle" font-size="10" fill="#94a3b8">→ TechnicalClaims</text>

  <!-- Self-loop for re-extract -->
  <path d="M190,260 C215,240 215,290 190,280" stroke="#a78bfa" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#a2)"/>
  <text x="220" y="268" font-size="9" fill="#a78bfa">retry≤2</text>

  <!-- Verifier node -->
  <rect x="270" y="240" width="140" height="60" rx="8" fill="#1c1930" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="340" y="260" text-anchor="middle" font-size="11" font-weight="600" fill="white">Verifier</text>
  <text x="340" y="275" text-anchor="middle" font-size="10" fill="#94a3b8">0 model calls</text>
  <text x="340" y="290" text-anchor="middle" font-size="10" fill="#94a3b8">concept ref check</text>
  <line x1="190" y1="270" x2="270" y2="270" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- Verifier outputs -->
  <text x="340" y="318" text-anchor="middle" font-size="9.5" fill="#64748b">drop unsupported claims</text>
  <text x="340" y="332" text-anchor="middle" font-size="9.5" fill="#64748b">abstain if coverage &lt; threshold</text>
  <line x1="340" y1="300" x2="340" y2="313" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Comm Coach (outside graph) -->
  <rect x="440" y="240" width="150" height="60" rx="8" fill="#1c1930" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="515" y="260" text-anchor="middle" font-size="11" font-weight="600" fill="white">Comm Coach</text>
  <text x="515" y="275" text-anchor="middle" font-size="10" fill="#94a3b8">Independent call</text>
  <text x="515" y="290" text-anchor="middle" font-size="10" fill="#94a3b8">→ CommObservations</text>
  <line x1="290" y1="117" x2="515" y2="240" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a2)"/>

  <!-- Arrow: gate → graph -->
  <line x1="360" y1="117" x2="120" y2="240" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a2)"/>
  <text x="240" y="190" text-anchor="middle" font-size="9.5" fill="#8b5cf6">passes gate</text>

  <!-- Deterministic scorer -->
  <rect x="650" y="210" width="170" height="115" rx="10" fill="#151327" stroke="#34d399" stroke-width="2"/>
  <text x="735" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#34d399">Python Scorer</text>
  <text x="735" y="249" text-anchor="middle" font-size="10" fill="#94a3b8">fairscore.py</text>
  <text x="735" y="265" text-anchor="middle" font-size="10" fill="#94a3b8">band_from_claims()</text>
  <text x="735" y="281" text-anchor="middle" font-size="10" fill="#94a3b8">comm_band()</text>
  <text x="735" y="297" text-anchor="middle" font-size="10" fill="#94a3b8">Model NEVER scores</text>
  <text x="735" y="313" text-anchor="middle" font-size="10" fill="#94a3b8">Code owns the verdict</text>

  <!-- Arrows → scorer -->
  <line x1="620" y1="270" x2="650" y2="270" stroke="#34d399" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- Output -->
  <rect x="650" y="360" width="170" height="60" rx="10" fill="#1c1930" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="735" y="382" text-anchor="middle" font-size="12" font-weight="600" fill="white">ScoreResult</text>
  <text x="735" y="398" text-anchor="middle" font-size="10" fill="#94a3b8">technical_band + evidence</text>
  <text x="735" y="413" text-anchor="middle" font-size="10" fill="#94a3b8">communication_band</text>
  <line x1="735" y1="325" x2="735" y2="360" stroke="#34d399" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- Bands legend -->
  <rect x="30" y="390" width="580" height="35" rx="6" fill="#151327" stroke="rgba(255,255,255,0.06)"/>
  <text x="50" y="408" font-size="10" font-weight="600" fill="#f87171">■ Weak</text>
  <text x="120" y="408" font-size="10" font-weight="600" fill="#fbbf24">■ Partial</text>
  <text x="195" y="408" font-size="10" font-weight="600" fill="#4ade80">■ Solid</text>
  <text x="265" y="408" font-size="10" font-weight="600" fill="#34d399">■ Strong</text>
  <text x="340" y="408" font-size="10" fill="#64748b">|</text>
  <text x="360" y="408" font-size="10" fill="#94a3b8">Abstain when support &lt; threshold (never guess)</text>
  <text x="50" y="420" font-size="9.5" fill="#64748b">Technical and communication scored independently — plain English cannot lower the technical band</text>

  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8b5cf6"/>
    </marker>
  </defs>
</svg>
