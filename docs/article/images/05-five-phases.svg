<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter,Segoe UI,system-ui,sans-serif">
  <rect width="800" height="380" fill="#07060d" rx="12"/>
  <pattern id="d5" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="11" cy="11" r="1" fill="rgba(255,255,255,0.04)"/>
  </pattern>
  <rect width="800" height="380" fill="url(#d5)" rx="12"/>

  <text x="400" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="white">CareerLift AI — Five Learning Phases</text>
  <text x="400" y="50" text-anchor="middle" font-size="11" fill="#64748b">All phases feed into the shared Phase 0 SkillSignals → LearnerModel → Recommendations pipeline</text>

  <!-- Central Phase 0 hub -->
  <circle cx="400" cy="210" r="70" fill="#151327" stroke="#8b5cf6" stroke-width="2"/>
  <text x="400" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="white">Phase 0</text>
  <text x="400" y="215" text-anchor="middle" font-size="11" fill="#a78bfa">Learning</text>
  <text x="400" y="231" text-anchor="middle" font-size="11" fill="#a78bfa">Intelligence</text>
  <text x="400" y="247" text-anchor="middle" font-size="9.5" fill="#64748b">SkillSignals</text>
  <text x="400" y="260" text-anchor="middle" font-size="9.5" fill="#64748b">LearnerModel</text>

  <!-- Phase 1 -->
  <rect x="50" y="75" width="155" height="100" rx="10" fill="#151327" stroke="#6366f1" stroke-width="2"/>
  <text x="128" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#818cf8">Phase 1</text>
  <text x="128" y="114" text-anchor="middle" font-size="11" fill="white">Interview Studio</text>
  <text x="128" y="130" text-anchor="middle" font-size="9.5" fill="#94a3b8">FairScore dual-axis</text>
  <text x="128" y="144" text-anchor="middle" font-size="9.5" fill="#94a3b8">Strands graph agent</text>
  <text x="128" y="158" text-anchor="middle" font-size="9.5" fill="#94a3b8">5 question categories</text>
  <line x1="205" y1="155" x2="340" y2="195" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a5)"/>

  <!-- Phase 2 -->
  <rect x="50" y="235" width="155" height="100" rx="10" fill="#151327" stroke="#22c55e" stroke-width="2"/>
  <text x="128" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#4ade80">Phase 2</text>
  <text x="128" y="274" text-anchor="middle" font-size="11" fill="white">Coding Arena</text>
  <text x="128" y="290" text-anchor="middle" font-size="9.5" fill="#94a3b8">Docker sandbox</text>
  <text x="128" y="304" text-anchor="middle" font-size="9.5" fill="#94a3b8">Python / C++ / Java</text>
  <text x="128" y="318" text-anchor="middle" font-size="9.5" fill="#94a3b8">6 problems · 11/11 isolated</text>
  <line x1="205" y1="265" x2="340" y2="225" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a5)"/>

  <!-- Phase 3 -->
  <rect x="595" y="75" width="155" height="100" rx="10" fill="#151327" stroke="#f97316" stroke-width="2"/>
  <text x="673" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#fb923c">Phase 3</text>
  <text x="673" y="114" text-anchor="middle" font-size="11" fill="white">Assessment</text>
  <text x="673" y="130" text-anchor="middle" font-size="9.5" fill="#94a3b8">120 MCQ questions</text>
  <text x="673" y="144" text-anchor="middle" font-size="9.5" fill="#94a3b8">12 CS categories</text>
  <text x="673" y="158" text-anchor="middle" font-size="9.5" fill="#94a3b8">Timed · server-authoritative</text>
  <line x1="595" y1="155" x2="460" y2="195" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a5)"/>

  <!-- Phase 4 -->
  <rect x="595" y="235" width="155" height="100" rx="10" fill="#151327" stroke="#3b82f6" stroke-width="2"/>
  <text x="673" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#60a5fa">Phase 4</text>
  <text x="673" y="274" text-anchor="middle" font-size="11" fill="white">System Design</text>
  <text x="673" y="290" text-anchor="middle" font-size="9.5" fill="#94a3b8">5 scenarios</text>
  <text x="673" y="304" text-anchor="middle" font-size="9.5" fill="#94a3b8">Rubric-based grading</text>
  <text x="673" y="318" text-anchor="middle" font-size="9.5" fill="#94a3b8">Components + connections</text>
  <line x1="595" y1="265" x2="460" y2="225" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a5)"/>

  <!-- Learning loop label -->
  <text x="400" y="148" text-anchor="middle" font-size="10" fill="#64748b">Every phase emits</text>
  <text x="400" y="161" text-anchor="middle" font-size="10" fill="#8b5cf6">source_module=interview|</text>
  <text x="400" y="174" text-anchor="middle" font-size="10" fill="#8b5cf6">coding|assessment|sysdesign</text>

  <!-- Bottom: output -->
  <rect x="260" y="310" width="280" height="55" rx="8" fill="#1c1930" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="400" y="330" text-anchor="middle" font-size="11" font-weight="600" fill="white">Dashboard + Recommendations</text>
  <text x="400" y="346" text-anchor="middle" font-size="9.5" fill="#94a3b8">Mastery labels · Spaced repetition · Misconception map</text>
  <text x="400" y="358" text-anchor="middle" font-size="9.5" fill="#64748b">Labels: Not enough evidence → Emerging → Developing → Proficient → Strong</text>
  <line x1="400" y1="280" x2="400" y2="310" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#a5)"/>

  <defs>
    <marker id="a5" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8b5cf6"/>
    </marker>
  </defs>
</svg>
