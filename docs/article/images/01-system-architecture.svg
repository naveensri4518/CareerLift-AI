<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Inter,Segoe UI,system-ui,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0a14"/>
      <stop offset="100%" stop-color="#07060d"/>
    </linearGradient>
    <linearGradient id="purpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="900" height="580" fill="url(#bgGrad)" rx="12"/>
  <!-- Dot grid -->
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="11" cy="11" r="1" fill="rgba(255,255,255,0.045)"/>
  </pattern>
  <rect width="900" height="580" fill="url(#dots)" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="white">CareerLift AI — System Architecture</text>
  <text x="450" y="56" text-anchor="middle" font-size="11" fill="#64748b">Five learning phases powered by Strands Agents SDK + Amazon Bedrock</text>

  <!-- User -->
  <rect x="30" y="90" width="110" height="50" rx="10" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="85" y="111" text-anchor="middle" font-size="11" fill="#a78bfa">👩‍💻 Student</text>
  <text x="85" y="128" text-anchor="middle" font-size="10" fill="#64748b">Browser / HTTPS</text>

  <!-- React Frontend -->
  <rect x="190" y="75" width="150" height="80" rx="10" fill="#151327" stroke="#6366f1" stroke-width="1.5"/>
  <text x="265" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="white">React Frontend</text>
  <text x="265" y="114" text-anchor="middle" font-size="10" fill="#94a3b8">React 18 + Vite + Tailwind</text>
  <text x="265" y="130" text-anchor="middle" font-size="10" fill="#94a3b8">5 pages per phase</text>
  <text x="265" y="145" text-anchor="middle" font-size="10" fill="#94a3b8">Same-origin /api proxy</text>

  <!-- Arrow user → frontend -->
  <line x1="140" y1="115" x2="190" y2="115" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Nginx -->
  <rect x="390" y="90" width="120" height="50" rx="10" fill="#100e1c" stroke="#4ade80" stroke-width="1.5"/>
  <text x="450" y="111" text-anchor="middle" font-size="12" font-weight="600" fill="#4ade80">Nginx</text>
  <text x="450" y="128" text-anchor="middle" font-size="10" fill="#94a3b8">HTTPS 443 · Reverse proxy</text>

  <!-- Arrow frontend → nginx -->
  <line x1="340" y1="115" x2="390" y2="115" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- FastAPI backend -->
  <rect x="560" y="68" width="180" height="100" rx="10" fill="#151327" stroke="#8b5cf6" stroke-width="2" filter="url(#glow)"/>
  <text x="650" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="white">FastAPI / Uvicorn</text>
  <text x="650" y="108" text-anchor="middle" font-size="10" fill="#94a3b8">6 routers (P0–P4)</text>
  <text x="650" y="123" text-anchor="middle" font-size="10" fill="#94a3b8">Bearer-token auth</text>
  <text x="650" y="138" text-anchor="middle" font-size="10" fill="#94a3b8">Per-student ownership</text>
  <text x="650" y="153" text-anchor="middle" font-size="10" fill="#94a3b8">127.0.0.1:8000 (loopback)</text>

  <!-- Arrow nginx → backend -->
  <line x1="510" y1="115" x2="560" y2="118" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- SQLite -->
  <rect x="390" y="195" width="130" height="55" rx="10" fill="#100e1c" stroke="#f97316" stroke-width="1.5"/>
  <text x="455" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#f97316">SQLite</text>
  <text x="455" y="232" text-anchor="middle" font-size="10" fill="#94a3b8">/data/careerlift.db</text>
  <text x="455" y="247" text-anchor="middle" font-size="10" fill="#94a3b8">Persistent EBS volume</text>

  <!-- Arrow backend → sqlite -->
  <line x1="620" y1="168" x2="520" y2="220" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Strands Agent -->
  <rect x="560" y="210" width="180" height="90" rx="10" fill="#151327" stroke="#a78bfa" stroke-width="2"/>
  <text x="650" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#a78bfa">Strands Agent</text>
  <text x="650" y="249" text-anchor="middle" font-size="10" fill="#94a3b8">GraphBuilder graph</text>
  <text x="650" y="264" text-anchor="middle" font-size="10" fill="#94a3b8">Structured output</text>
  <text x="650" y="279" text-anchor="middle" font-size="10" fill="#94a3b8">BeforeModelCallEvent hook</text>
  <text x="650" y="294" text-anchor="middle" font-size="10" fill="#94a3b8">FileSessionManager</text>

  <!-- Arrow backend → strands -->
  <line x1="650" y1="168" x2="650" y2="210" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Bedrock -->
  <rect x="560" y="355" width="180" height="60" rx="10" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="650" y="378" text-anchor="middle" font-size="12" font-weight="600" fill="#f59e0b">Amazon Bedrock</text>
  <text x="650" y="395" text-anchor="middle" font-size="10" fill="#94a3b8">Nova 2 Lite · us-east-1</text>
  <text x="650" y="410" text-anchor="middle" font-size="10" fill="#94a3b8">us.amazon.nova-2-lite-v1:0</text>

  <!-- Arrow strands → bedrock -->
  <line x1="650" y1="300" x2="650" y2="355" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Docker sandbox -->
  <rect x="190" y="210" width="155" height="55" rx="10" fill="#100e1c" stroke="#22c55e" stroke-width="1.5"/>
  <text x="267" y="231" text-anchor="middle" font-size="12" font-weight="600" fill="#22c55e">Docker Sandbox</text>
  <text x="267" y="247" text-anchor="middle" font-size="10" fill="#94a3b8">--network none  --read-only</text>
  <text x="267" y="262" text-anchor="middle" font-size="10" fill="#94a3b8">--cap-drop ALL  uid=1000</text>

  <!-- Arrow backend → docker -->
  <line x1="590" y1="200" x2="345" y2="237" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Phase boxes -->
  <text x="450" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="white">Five Learning Phases</text>

  <rect x="30" y="325" width="120" height="55" rx="8" fill="#151327" stroke="#8b5cf6" stroke-width="1"/>
  <text x="90" y="347" text-anchor="middle" font-size="10" font-weight="600" fill="#a78bfa">Phase 0</text>
  <text x="90" y="362" text-anchor="middle" font-size="9.5" fill="#94a3b8">Learning</text>
  <text x="90" y="374" text-anchor="middle" font-size="9.5" fill="#94a3b8">Intelligence</text>

  <rect x="165" y="325" width="120" height="55" rx="8" fill="#151327" stroke="#6366f1" stroke-width="1"/>
  <text x="225" y="347" text-anchor="middle" font-size="10" font-weight="600" fill="#818cf8">Phase 1</text>
  <text x="225" y="362" text-anchor="middle" font-size="9.5" fill="#94a3b8">Interview</text>
  <text x="225" y="374" text-anchor="middle" font-size="9.5" fill="#94a3b8">Studio</text>

  <rect x="300" y="325" width="120" height="55" rx="8" fill="#151327" stroke="#22c55e" stroke-width="1"/>
  <text x="360" y="347" text-anchor="middle" font-size="10" font-weight="600" fill="#4ade80">Phase 2</text>
  <text x="360" y="362" text-anchor="middle" font-size="9.5" fill="#94a3b8">Secure Coding</text>
  <text x="360" y="374" text-anchor="middle" font-size="9.5" fill="#94a3b8">Arena</text>

  <rect x="435" y="325" width="120" height="55" rx="8" fill="#151327" stroke="#f97316" stroke-width="1"/>
  <text x="495" y="347" text-anchor="middle" font-size="10" font-weight="600" fill="#fb923c">Phase 3</text>
  <text x="495" y="362" text-anchor="middle" font-size="9.5" fill="#94a3b8">Technical</text>
  <text x="495" y="374" text-anchor="middle" font-size="9.5" fill="#94a3b8">Assessment</text>

  <rect x="570" y="325" width="120" height="55" rx="8" fill="#100e1c" stroke="#3b82f6" stroke-width="1"/>
  <text x="630" y="347" text-anchor="middle" font-size="10" font-weight="600" fill="#60a5fa">Phase 4</text>
  <text x="630" y="362" text-anchor="middle" font-size="9.5" fill="#94a3b8">System Design</text>
  <text x="630" y="374" text-anchor="middle" font-size="9.5" fill="#94a3b8">Academy</text>

  <!-- AWS infra row -->
  <text x="450" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="white">AWS Infrastructure</text>

  <rect x="30" y="432" width="110" height="45" rx="8" fill="none" stroke="#f59e0b" stroke-width="1"/>
  <text x="85" y="452" text-anchor="middle" font-size="10" font-weight="600" fill="#fbbf24">EC2 t3.small</text>
  <text x="85" y="467" text-anchor="middle" font-size="9.5" fill="#64748b">AL2023 · us-east-1a</text>

  <rect x="155" y="432" width="110" height="45" rx="8" fill="none" stroke="#22c55e" stroke-width="1"/>
  <text x="210" y="452" text-anchor="middle" font-size="10" font-weight="600" fill="#4ade80">EBS gp3</text>
  <text x="210" y="467" text-anchor="middle" font-size="9.5" fill="#64748b">20 GB · /data</text>

  <rect x="280" y="432" width="110" height="45" rx="8" fill="none" stroke="#8b5cf6" stroke-width="1"/>
  <text x="335" y="452" text-anchor="middle" font-size="10" font-weight="600" fill="#a78bfa">IAM Role</text>
  <text x="335" y="467" text-anchor="middle" font-size="9.5" fill="#64748b">EC2RuntimeRole</text>

  <rect x="405" y="432" width="110" height="45" rx="8" fill="none" stroke="#f97316" stroke-width="1"/>
  <text x="460" y="452" text-anchor="middle" font-size="10" font-weight="600" fill="#fb923c">SSM</text>
  <text x="460" y="467" text-anchor="middle" font-size="9.5" fill="#64748b">/careerlift/auth_pepper</text>

  <rect x="530" y="432" width="110" height="45" rx="8" fill="none" stroke="#3b82f6" stroke-width="1"/>
  <text x="585" y="452" text-anchor="middle" font-size="10" font-weight="600" fill="#60a5fa">CloudWatch</text>
  <text x="585" y="467" text-anchor="middle" font-size="9.5" fill="#64748b">Logs + $25 budget</text>

  <rect x="655" y="432" width="110" height="45" rx="8" fill="none" stroke="#34d399" stroke-width="1"/>
  <text x="710" y="452" text-anchor="middle" font-size="10" font-weight="600" fill="#34d399">Let's Encrypt</text>
  <text x="710" y="467" text-anchor="middle" font-size="9.5" fill="#64748b">HTTPS · nip.io</text>

  <!-- Stats bar -->
  <rect x="30" y="500" width="840" height="60" rx="8" fill="#151327" stroke="rgba(255,255,255,0.06)"/>
  <text x="160" y="522" text-anchor="middle" font-size="11" fill="#94a3b8">186 backend tests</text>
  <text x="160" y="538" text-anchor="middle" font-size="20" font-weight="700" fill="white">✅</text>
  <text x="310" y="522" text-anchor="middle" font-size="11" fill="#94a3b8">13/13 public E2E</text>
  <text x="310" y="538" text-anchor="middle" font-size="20" font-weight="700" fill="white">✅</text>
  <text x="460" y="522" text-anchor="middle" font-size="11" fill="#94a3b8">Docker sandbox 11/11</text>
  <text x="460" y="538" text-anchor="middle" font-size="20" font-weight="700" fill="white">✅</text>
  <text x="630" y="522" text-anchor="middle" font-size="11" fill="#94a3b8">HTTPS Let's Encrypt</text>
  <text x="630" y="538" text-anchor="middle" font-size="20" font-weight="700" fill="white">✅</text>
  <text x="790" y="522" text-anchor="middle" font-size="11" fill="#94a3b8">120 MCQ questions</text>
  <text x="790" y="538" text-anchor="middle" font-size="20" font-weight="700" fill="white">✅</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
  </defs>
</svg>
